<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Wing 3D CSS - Modularny Projekt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px; 
        }

        .space-scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: orbit 15s infinite linear;
        }
        
        .component-3d {
            position: absolute;
            transform-style: preserve-3d;
        }

        /*
           1. KADŁUB / FUSELAGE  
        */

        .fuselage {
            width: 40px;
            height: 40px;
            position: absolute;
            transform: translate3d(0px, 0px, 60px);
        }
        .fuselage .part {
            position: absolute;
            width: 40px;
            height: 350px; 
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #c4c4cb 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }

        .fuselage .top    { 
            transform: translateY(-163px) translateZ(50px) rotateX(86deg); 
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #c4c4cb 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
            height: 350px; }
        .fuselage .bottom { 
            transform: translateY(-125px) translateZ(50px) rotateX(90deg); 
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #c4c4cb 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }
        .fuselage .left { 
            transform: translateX(-175px) translateZ(50px) rotateY(-90deg); 
            background: linear-gradient(
                -180deg, 
                #e0dede 10%, 
                #e2e2e8 40%,  
                #981010 30%,  
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
            width: 350px; 
            height: 50px;;
            clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 0% 0%) 
        }

        .fuselage .right { 
            transform: translateX(-135px) translateZ(50px) rotateY(-90deg); 
                        background: linear-gradient(
                -180deg, 
                #e0dede 10%, 
                #e2e2e8 40%,  
                #981010 30%,  
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
            width: 350px; 
            height: 50px; 
            clip-path: polygon(0% 100%, 100% 100%, 100% 50%, 0% 0%) 
        }

        .fuselage .back { 
            width: 40px;
            height: 50px;
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #c4c4cb 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
            transform: translateY(0px) translateZ(-125px) rotateX(180deg);
        }
        .fuselage .front { 
            width: 40px;
            height: 25px;
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #9e9ea8 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
            transform: translateY(25px) translateZ(223px) rotateX(-180deg);
        }

        /* 
        2. KOKPIT / COCPIT
        */

        .cockpit {
            width: 40px;
            height: 25px; 
            position: absolute;
            transform-style: preserve-3d;
            
            transform: translate3d(0px, -45px, 80px); 
        }

        .cockpit .canopy-face {
            position: absolute;
            background: linear-gradient(
                135deg, 
                #888899 0%, 
                #33333d 30%, 
                #111115 50%, 
                #555566 75%, 
                #22222a 100%
            );
        }

        .cockpit .canopy-front {
            width: 40px;
            height: 60px;
            transform: translateZ(-10px) translateY(6px) rotateX(70deg);
            box-sizing: border-box;
            border: 1.5px solid rgba(200, 240, 255, 0.7); 
                

            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.75) 0%,   
                rgba(100, 200, 255, 0.35) 30%,   
                rgba(20, 35, 50, 0.45) 70%,      
                rgba(10, 15, 25, 0.8) 100%     
                );

                box-shadow: inset 0 0 8px rgba(120, 220, 255, 0.4);
                backdrop-filter: blur(2px); 
            
        }

        .cockpit .canopy-top {
            width: 40px;
            height: 90px;
            transform: translateY(-20px) translateZ(-83px) rotateX(90deg);
            position: absolute;
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #9e9ea8 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }

        .cockpit .canopy-left {
            width: 75px;
            height: 25px;
            transform: translateX(-38px) translateY(25px) translateZ(-10px) rotateY(90deg);
            clip-path: polygon(0% 100%, 100% 100%, 100% 0%);
                box-sizing: border-box;
                border: 1.5px solid rgba(200, 240, 255, 0.7); 
                background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.75) 0%,   
                    rgba(100, 200, 255, 0.35) 30%,   
                    rgba(20, 35, 50, 0.45) 70%,      
                    rgba(10, 15, 25, 0.8) 100%     
                );
                box-shadow: inset 0 0 8px rgba(120, 220, 255, 0.4);
                backdrop-filter: blur(2px); 
        }

        .cockpit .canopy-right {
            width: 75px;
            height: 25px;
            transform: translateX(3px) translateY(25px) translateZ(-10px) rotateY(-90deg);
            clip-path: polygon(0% 100%, 100% 100%, 0% 0%);
                box-sizing: border-box;
                border: 1.5px solid rgba(200, 240, 255, 0.7);
                background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.75) 0%,   
                    rgba(100, 200, 255, 0.35) 30%,   
                    rgba(20, 35, 50, 0.45) 70%,      
                    rgba(10, 15, 25, 0.8) 100%     
                );
                box-shadow: inset 0 0 8px rgba(120, 220, 255, 0.4);
                backdrop-filter: blur(2px); 
        }
        .cockpit .canopy-back {
            width: 40px;
            height: 14px;
            transform: translateY(25px) translateZ(-129px) rotateX(180deg);
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #9e9ea8 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }
        .cockpit .canopy-left-w1{
            width: 90px;
            height: 20px;
            transform: translateX(-45px) translateY(25px) translateZ(-90px) rotateY(90deg);
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #9e9ea8 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }
        .cockpit .canopy-right-w1{
            width: 90px;
            height: 20px;
            transform: translateX(-5px) translateY(25px) translateZ(-90px) rotateY(-90deg);
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #9e9ea8 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }

        /* 
           2. SKRZYDŁA / WINGS
        */

        .wing {
        width: 180px;
        height: 80px;
        position: absolute;
        transform-style: preserve-3d;
        }


        .wing .wing-face {
            position: absolute;
            background: linear-gradient(
                90deg, 
                #ffffff 0%, 
                #8b7e7e 5%, 
                #e2e2e8 35%,              
                #a89e9e 50%, 
                #f0f0f8 70%, 
                #bcbcc6 100%
            );
        }

        .wing .top { 
            width: 180px; 
            height: 60px; 
            transform: translateZ(5px); 
            clip-path: polygon(0% 0%, 100% 30%, 100% 100%, 0% 100%); 
        }

        .wing .bottom { 
            width: 180px; 
            height: 60px; 
            transform: translateZ(-5px) rotateY(180deg); 
            clip-path: polygon(0% 30%, 100% 0%, 100% 100%, 0% 100%); 
        }

        .wing .front { 
            width: 180px; 
            height: 10px;  
            transform: translateY(20px) rotateX(-90deg); 
        } 

        .wing .back { 
            width: 180px; 
            height: 10px;  
            transform: translateY(55px) rotateX(90deg); 
        }

        .wing .left { 
            width: 10px;   
            height: 60px; 
            transform: translateX(-5px) rotateY(-90deg); 
        }
     
        .wing .right { 
            width: 10px;   
            height: 40px; 
            transform: translateX(175px) translateY(20px) rotateY(90deg); 
        }

        .wing-top-right {
            transform: translate3d(100px, -50px, -20px) rotateX(90deg) rotateZ(0deg) rotateY(-20deg);
        }

        .wing-top-left {
            transform: translate3d(-100px, -50px, -20px) rotateX(90deg) rotateZ(0deg) rotateY(-160deg);
        }

        .wing-bottom-right {
            transform: translate3d(100px, 20px, -20px) rotateZ(0deg) rotateX(90deg) rotateY(20deg);
        }

        .wing-bottom-left {
            transform: translate3d(-100px, 20px, -20px) rotateZ(0deg) rotateX(90deg) rotateY(160deg);
        }


        /* 
           3. SILNIKI (ENGINES) - Cylindryczne bloki zamontowane przy skrzydłach
        */

        .engine {
            width: 40px;
            height: 40px;
            position: absolute;
            transform-style: preserve-3d;
        }

        .engine .cylinder-wall {
            position: absolute;
            width: 11px;
            height: 60px;
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
            

            left: 14.5px;
            top: -40px;
        }

        .engine .cap {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #ffffff; 
            background: radial-gradient(circle, #d2cece 0%, #c9c4c4 50%, #505050 100%);
            border-radius: 50%;
            box-sizing: border-box;
        }

        .engine .cap-front { transform: translateZ(0px) translateY(-60px) rotateX(90deg);}
        .engine .cap-back  { transform: translateZ(60px) translateZ(-60px) translateY(0px)rotateX(90deg); }

        .engine .w1  { transform: rotateY(0deg) translateZ(20px); }
        .engine .w2  { transform: rotateY(30deg) translateZ(20px); }
        .engine .w3  { transform: rotateY(60deg) translateZ(20px); }
        .engine .w4  { transform: rotateY(90deg) translateZ(20px); }
        .engine .w5  { transform: rotateY(120deg) translateZ(20px); }
        .engine .w6  { transform: rotateY(150deg) translateZ(20px); }
        .engine .w7  { transform: rotateY(180deg) translateZ(20px); }
        .engine .w8  { transform: rotateY(210deg) translateZ(20px); }
        .engine .w9  { transform: rotateY(240deg) translateZ(20px); }
        .engine .w10 { transform: rotateY(270deg) translateZ(20px); }
        .engine .w11 { transform: rotateY(300deg) translateZ(20px); }
        .engine .w12 { transform: rotateY(330deg) translateZ(20px); }

        .engine-tr { transform: translate3d(40px, -45px, 20px) rotateX(90deg); }
        .engine-tl { transform: translate3d(-40px, -45px, 20px)rotateX(90deg);; }
        .engine-br { transform: translate3d(40px, 20px, 20px) rotateX(90deg);; }
        .engine-bl { transform: translate3d(-40px, 20px, 20px) rotateX(90deg);; }

         /* 
            4. WSPOMAGAJACE SILNIKI / ENGINES) 
         */
        .engine-narrow {
        width: 24px;
        height: 24px; 
        position: absolute;
        transform-style: preserve-3d;
    }

    .engine-narrow .cylinder-wall {
        position: absolute;
        width: 6.5px; 
        height: 60px;
        background: linear-gradient(
            135deg, 
            #ffffff 0%, 
            #e2e2e8 35%, 
            #d9d9e1 50%, 
            #f0f0f8 70%, 
            #d5d5dc 100%
            );
        left: 8.75px; 
        top: -40px;
    }

    .engine-narrow .cap {
        position: absolute;
        width: 24px;
        height: 24px;
        background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
        border-radius: 50%;
    }
    .engine-narrow .cap-front { transform: translateZ(0px) translateY(-50px) rotateX(90deg); }
    .engine-narrow .cap-back  { transform: translateZ(0px) translateY(0px) rotateX(90deg); }

    .engine-narrow .w1  { transform: rotateY(0deg) translateZ(12px); }
    .engine-narrow .w2  { transform: rotateY(30deg) translateZ(12px); }
    .engine-narrow .w3  { transform: rotateY(60deg) translateZ(12px); }
    .engine-narrow .w4  { transform: rotateY(90deg) translateZ(12px); }
    .engine-narrow .w5  { transform: rotateY(120deg) translateZ(12px); }
    .engine-narrow .w6  { transform: rotateY(150deg) translateZ(12px); }
    .engine-narrow .w7  { transform: rotateY(180deg) translateZ(12px); }
    .engine-narrow .w8  { transform: rotateY(210deg) translateZ(12px); }
    .engine-narrow .w9  { transform: rotateY(240deg) translateZ(12px); }
    .engine-narrow .w10 { transform: rotateY(270deg) translateZ(12px); }
    .engine-narrow .w11 { transform: rotateY(300deg) translateZ(12px); }
    .engine-narrow .w12 { transform: rotateY(330deg) translateZ(12px); }

    .engine-narrow-tr { transform: translate3d(40px, -45px, -40px) rotateX(90deg); }
    .engine-narrow-tl { transform: translate3d(-40px, -45px, -40px) rotateX(90deg); }
    .engine-narrow-br { transform: translate3d(40px, 20px, -40px) rotateX(90deg); }
    .engine-narrow-bl { transform: translate3d(-40px, 20px, -40px) rotateX(90deg); }

        /* 
           5. DZIAŁKA LASEROWE / LASER CANNONS
        */

    .laser-cannon {
        width: 6px;
        height: 10px;
        background: linear-gradient(
            135deg, 
            #ffffff 0%, 
            #e2e2e8 35%, 
            #d9d9e1 50%, 
            #f0f0f8 70%, 
            #d5d5dc 100%
        );
        position: absolute;
        transform-style: preserve-3d;
    }

    .laser-cannon::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 120px;
            background: rgba(200, 200, 205, 0.9);
            transform: rotateX(90deg) translateZ(60px);
        }
    .laser-tr { transform: translate3d(170px, -80px, 55px); }
    .laser-tl { transform: translate3d(-170px, -80px, 55px); }
    .laser-br { transform: translate3d(170px, 40px, 50px); }
    .laser-bl { transform: translate3d(-170px, 40px, 50px); }

        /* 
           6. CYLINDRY NA DZIAŁKA LASEROWE / LASER CANNONS
        */

    .engine-super-narrow {
        width: 12px;  /* Średnica zwężona do 12px */
        height: 12px; /* Średnica zwężona do 12px */
        position: absolute;
        transform-style: preserve-3d;
        background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
    }

    .engine-super-narrow .cylinder-wall {
        position: absolute;
        width: 3.2px; 
        height: 60px;
        background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
        left: 4.4px; 
        top: -40px;
    }


    .engine-super-narrow .cap {
        position: absolute;
        width: 12px;
        height: 12px;
        background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
        border-radius: 50%;
    }
    .engine-super-narrow .cap-front { transform: translateZ(0px) translateY(-45px) rotateX(90deg); }
    .engine-super-narrow .cap-back  { transform: translateZ(0px) translateY(0px) rotateX(90deg); }

    .engine-super-narrow .w1  { transform: rotateY(0deg) translateZ(6px); }
    .engine-super-narrow .w2  { transform: rotateY(30deg) translateZ(6px); }
    .engine-super-narrow .w3  { transform: rotateY(60deg) translateZ(6px); }
    .engine-super-narrow .w4  { transform: rotateY(90deg) translateZ(6px); }
    .engine-super-narrow .w5  { transform: rotateY(120deg) translateZ(6px); }
    .engine-super-narrow .w6  { transform: rotateY(150deg) translateZ(6px); }
    .engine-super-narrow .w7  { transform: rotateY(180deg) translateZ(6px); }
    .engine-super-narrow .w8  { transform: rotateY(210deg) translateZ(6px); }
    .engine-super-narrow .w9  { transform: rotateY(240deg) translateZ(6px); }
    .engine-super-narrow .w10 { transform: rotateY(270deg) translateZ(6px); }
    .engine-super-narrow .w11 { transform: rotateY(300deg) translateZ(6px); }
    .engine-super-narrow .w12 { transform: rotateY(330deg) translateZ(6px); }

    .engine-sn-tr { transform: translate3d(170px, -86px, -5px) rotateX(90deg); }
    .engine-sn-tl { transform: translate3d(-170px, -86px, -5px) rotateX(90deg); }
    .engine-sn-br { transform: translate3d(170px, 36px, -5px) rotateX(90deg); }
    .engine-sn-bl { transform: translate3d(-170px, 36px, -5px) rotateX(90deg); }

    /*
   DZIÓB / NOSECONE
   */

    .nosecone {
        width: 40px;
        height: 40px;
        transform: translate3d(0px, 200px, 0px);
        transform-style: preserve-3d;
    }


    .nose-face {
        position: absolute;
        box-sizing: border-box;
        background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #e2e2e8 35%, 
                #d9d9e1 50%, 
                #f0f0f8 70%, 
                #d5d5dc 100%
            );
    }

    .nose-top {
        width: 40px;
        height: 55px;
        transform: translate3d(0px, -191px, 310px) rotateX(64deg);
    }

    .nose-bottom {
        width: 40px;
        height: 50px;
        transform: translate3d(0px,-175px, 310px) rotateX(90deg);
    }

    .nose-tri-top-left {
        width: 25px;
        height: 50px;
        clip-path: polygon(0% 0%, 100% 0%, 0% 100%);
        transform: translate3d(-12px, -188px, 310px) rotateY(270deg) rotateZ(270deg);
    }

    .nose-tri-top-right {
        width: 25px;
        height: 50px;
        clip-path: polygon(0% 0%, 100% 0%, 0% 100%);
        transform: translate3d(28px, -187px, 310px) rotateY(270deg) rotateZ(270deg);
    }


    </style>
</head>
<body>

    <div class="space-scene">

        <div class="component-3d fuselage">
            <div class="part top"></div>
            <div class="part bottom"></div>
            <div class="part left"></div>
            <div class="part right"></div>
            <div class="part back"></div>
            <div class="part front"></div>
        </div>

        <div class="component-3d wing wing-top-right">
            <div class="wing-face top"></div><div class="wing-face bottom"></div>
            <div class="wing-face front"></div><div class="wing-face back"></div>
            <div class="wing-face left"></div><div class="wing-face right"></div>
        </div>

        <div class="component-3d wing wing-top-left">
            <div class="wing-face top"></div><div class="wing-face bottom"></div>
            <div class="wing-face front"></div><div class="wing-face back"></div>
            <div class="wing-face left"></div><div class="wing-face right"></div>
        </div>
 
        <div class="component-3d wing wing-bottom-right">
            <div class="wing-face top"></div><div class="wing-face bottom"></div>
            <div class="wing-face front"></div><div class="wing-face back"></div>
            <div class="wing-face left"></div><div class="wing-face right"></div>
        </div>

        <div class="component-3d wing wing-bottom-left">
            <div class="wing-face top"></div><div class="wing-face bottom"></div>
            <div class="wing-face front"></div><div class="wing-face back"></div>
            <div class="wing-face left"></div><div class="wing-face right"></div>
        </div>

        <div class="component-3d engine engine-tr">
        <div class="cap cap-front"></div><div class="cap cap-back"></div>
            <div class="cylinder-wall w1"></div><div class="cylinder-wall w2"></div><div class="cylinder-wall w3"></div><div class="cylinder-wall w4"></div>
            <div class="cylinder-wall w5"></div><div class="cylinder-wall w6"></div><div class="cylinder-wall w7"></div><div class="cylinder-wall w8"></div>
            <div class="cylinder-wall w9"></div><div class="cylinder-wall w10"></div><div class="cylinder-wall w11"></div><div class="cylinder-wall w12"></div>
        </div>

        <div class="component-3d engine engine-tl">
            <div class="cap cap-front"></div><div class="cap cap-back"></div>
            <div class="cylinder-wall w1"></div><div class="cylinder-wall w2"></div><div class="cylinder-wall w3"></div><div class="cylinder-wall w4"></div>
            <div class="cylinder-wall w5"></div><div class="cylinder-wall w6"></div><div class="cylinder-wall w7"></div><div class="cylinder-wall w8"></div>
            <div class="cylinder-wall w9"></div><div class="cylinder-wall w10"></div><div class="cylinder-wall w11"></div><div class="cylinder-wall w12"></div>
        </div>

        <div class="component-3d engine engine-br">
            <div class="cap cap-front"></div><div class="cap cap-back"></div>
            <div class="cylinder-wall w1"></div><div class="cylinder-wall w2"></div><div class="cylinder-wall w3"></div><div class="cylinder-wall w4"></div>
            <div class="cylinder-wall w5"></div><div class="cylinder-wall w6"></div><div class="cylinder-wall w7"></div><div class="cylinder-wall w8"></div>
            <div class="cylinder-wall w9"></div><div class="cylinder-wall w10"></div><div class="cylinder-wall w11"></div><div class="cylinder-wall w12"></div>
        </div>

        <div class="component-3d engine engine-bl">
            <div class="cap cap-front"></div><div class="cap cap-back"></div>

<script>
    const scene = document.querySelector('.space-scene');
    
    // Ustalamy początkowe kąty obrotu
    let currentX = -20; // Obrót góra/dół
    let currentY = 45;  // Obrót lewo/prawo
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    // Rozpoczęcie przeciągania
    window.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // Ruch myszką
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        // Obliczamy, jak daleko przesunęła się myszka
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        // Modyfikujemy kąty (dzielimy przez 2, żeby obrót był płynny i niezbyt szybki)
        currentY += deltaX * 0.5;
        currentX -= deltaY * 0.5;

        // Nakładamy rotację na scenę
        scene.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

        // Zapisujemy aktualną pozycję myszki jako poprzednią
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // Koniec przeciągania
    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // Obsługa ekranów dotykowych (opcjonalnie, dla telefonów)
    window.addEventListener('touchstart', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const deltaX = e.touches[0].clientX - previousMousePosition.x;
        const deltaY = e.touches[0].clientY - previousMousePosition.y;
        currentY += deltaX * 0.5;
        currentX -= deltaY * 0.5;
        scene.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    window.addEventListener('touchend', () => { isDragging = false; });
</script>
